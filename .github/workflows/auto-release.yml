# Publishes a patch release when main has changed since the last release and
# the tests pass. The GitHub release triggers the Zenodo integration, which
# mints a version DOI when the repository is switched on in Zenodo.
name: Auto release

on:
  workflow_call:
    inputs:
      setup:
        description: Shell command that installs what the tests need
        type: string
        default: "true"
      test:
        description: Shell command that runs the tests
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Anything to release?
        id: changes
        run: |
          # Release commits sit on their tags, not on main, so take the
          # highest tag rather than the nearest ancestor.
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "last=${last#v}" >> "$GITHUB_OUTPUT"
          if [ -z "$last" ]; then
            n=$(git rev-list --count HEAD)
          else
            n=$(git rev-list --count "$last"..HEAD)
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Commits since ${last:-the start}: $n" >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        if: steps.changes.outputs.count != '0'
        run: |
          ${{ inputs.setup }}
          ${{ inputs.test }}
      - name: Bump, tag and release
        if: steps.changes.outputs.count != '0'
        run: |
          git clone -q --depth 1 https://github.com/pablosancheznunez/research-tools-ops /tmp/ops
          version=$(python3 /tmp/ops/scripts/bump.py .maintenance.json "${{ steps.changes.outputs.last }}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$version"
          git tag "v$version"
          # Only the tag is pushed: main stays protected, with no bypass for Actions.
          git push -q origin "v$version"
          gh release create "v$version" --title "v$version" --generate-notes
