# Reads the package's public CRAN check results. Fails (and so opens a
# maintenance issue through the calling repository) when any CRAN flavour
# reports ERROR, WARN or FAIL, so problems are seen before CRAN's deadline.
# Packages not yet on CRAN pass silently. No credentials are used.
name: CRAN watch

on:
  workflow_call:
    inputs:
      package:
        description: Package name on CRAN
        type: string
        required: true

permissions:
  contents: read

jobs:
  cran:
    runs-on: ubuntu-latest
    steps:
      - name: Read CRAN check results
        env:
          PKG: ${{ inputs.package }}
        run: |
          url="https://cran.r-project.org/web/checks/check_results_${PKG}.html"
          code=$(curl -s -o page.html -w '%{http_code}' "$url")
          if [ "$code" = "404" ]; then
            echo "$PKG is not on CRAN yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "CRAN did not answer ($code); trying again next week." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=$(grep -oE '>(ERROR|WARN|FAIL)<' page.html | sort | uniq -c || true)
          if [ -n "$bad" ]; then
            {
              echo "CRAN reports problems for $PKG: $url"
              echo
              echo "$bad"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All CRAN checks OK or NOTE for $PKG: $url" >> "$GITHUB_STEP_SUMMARY"
