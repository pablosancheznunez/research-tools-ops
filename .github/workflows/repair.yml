# Proposes a repair for a failed run with a coding agent, then hands the result
# to the same controls as any other change: risk classification, CI, and
# auto-merge only below "high". The agent is not built in: each repository
# chooses one through two variables, so the provider can change at any time.
#
#   REPAIR_AGENT_SETUP  shell command that installs the agent CLI (optional)
#   REPAIR_AGENT_RUN    shell command that runs it; the task is in
#                       /tmp/repair-task.md and the agent must only edit files
#   REPAIR_AGENT_KEY    secret exposed to the agent as AGENT_API_KEY
#
# Without REPAIR_AGENT_RUN, or after three attempts in seven days, it opens an
# issue instead.
name: Automatic repair

on:
  workflow_call:
    inputs:
      run_id:
        description: Id of the failed workflow run
        type: string
        required: true
      ci_workflow:
        description: File name of the CI workflow to dispatch on the repair branch
        type: string
        default: ci.yml
    secrets:
      REPAIR_AGENT_KEY:
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: repair-${{ github.repository }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pablosancheznunez/research-tools-ops
          path: .ops
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Decide whether the agent may run
        id: gate
        env:
          AGENT: ${{ vars.REPAIR_AGENT_RUN }}
        run: |
          for l in auto-repair needs-attention; do gh label create "$l" --repo "$REPO" --force >/dev/null; done
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          recent=$(gh pr list --repo "$REPO" --state all --label auto-repair --search "created:>=$since" --json number --jq length)
          open=$(gh pr list --repo "$REPO" --state open --label auto-repair --json number --jq length)
          if [ "$open" -ge 1 ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          elif [ -z "$AGENT" ]; then
            echo "mode=issue" >> "$GITHUB_OUTPUT"
            echo "why=No repair agent is configured (REPAIR_AGENT_RUN), so no automatic repair was attempted." >> "$GITHUB_OUTPUT"
          elif [ "$recent" -ge 3 ]; then
            echo "mode=issue" >> "$GITHUB_OUTPUT"
            echo "why=Three automatic repair attempts in seven days. Stopping until a maintainer looks." >> "$GITHUB_OUTPUT"
          else
            echo "mode=agent" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the task
        if: steps.gate.outputs.mode == 'agent'
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --log-failed | tail -n 400 > /tmp/failure.log || true
          { cat .ops/prompts/repair.md; echo; echo "The failed run is $RUN_URL. Its failing log is in /tmp/failure.log."; } > /tmp/repair-task.md

      - name: Run the repair agent
        if: steps.gate.outputs.mode == 'agent'
        env:
          AGENT_API_KEY: ${{ secrets.REPAIR_AGENT_KEY }}
          SETUP: ${{ vars.REPAIR_AGENT_SETUP }}
          RUN: ${{ vars.REPAIR_AGENT_RUN }}
        run: |
          if [ -n "$SETUP" ]; then bash -c "$SETUP" >/dev/null; fi
          bash -c "$RUN" || echo "The repair agent exited with an error"

      - name: Open the repair pull request
        id: pr
        if: steps.gate.outputs.mode == 'agent'
        run: |
          rm -rf .ops
          # Controls are never changed by the agent; the push token could not
          # write workflows anyway.
          git add -A
          for p in .github .maintenance.json CONTRIBUTING.md; do
            git reset -q -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "made=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t files < <(git diff --cached --name-only)
          git clone -q --depth 1 https://github.com/pablosancheznunez/research-tools-ops /tmp/ops
          level=$(python3 /tmp/ops/scripts/risk.py .maintenance.json "${files[@]}")
          branch="repair/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qm "Automatic repair of failed run $RUN_ID"
          git push -q origin "$branch"
          for l in low medium high; do gh label create "risk:$l" --repo "$REPO" --force >/dev/null; done
          url=$(gh pr create --repo "$REPO" --head "$branch" \
            --title "Automatic repair of failed run $RUN_ID" \
            --label auto-repair --label "risk:$level" \
            --body "Repair proposed automatically for $RUN_URL. Risk level: **$level**. Changed: ${files[*]}")
          echo "made=yes" >> "$GITHUB_OUTPUT"
          if [ "$level" = "high" ]; then
            gh label create needs-human --repo "$REPO" --color B60205 --force >/dev/null
            gh pr edit "$url" --add-label needs-human
          else
            gh pr merge "$url" --auto --squash
          fi
          # Pull requests opened with this token do not start workflows on
          # their own, so CI is dispatched on the branch explicitly.
          gh workflow run "${{ inputs.ci_workflow }}" --repo "$REPO" --ref "$branch"

      - name: Open or update an issue
        if: steps.gate.outputs.mode == 'issue' || steps.pr.outputs.made == 'no'
        env:
          WHY: ${{ steps.gate.outputs.why || 'The repair agent could not produce a safe change.' }}
        run: |
          title="Maintenance: failed run needs attention"
          existing=$(gh issue list --repo "$REPO" --state open --label needs-attention --search "in:title \"$title\"" --json number --jq '.[0].number')
          body="$WHY Failed run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --label needs-attention --body "$body"
          fi
