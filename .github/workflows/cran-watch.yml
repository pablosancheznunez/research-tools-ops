# Reads the package's public CRAN check results. Fails (and so opens a
# maintenance issue through the calling repository) when any CRAN flavour
# reports ERROR, WARN or FAIL, so problems are seen before CRAN's deadline.
# Packages not yet on CRAN pass silently. When CRAN publishes a new version,
# it is released on GitHub too. No credentials beyond the built-in token.
name: CRAN watch

on:
  workflow_call:
    inputs:
      package:
        description: Package name on CRAN
        type: string
        required: true

permissions:
  contents: write

jobs:
  cran:
    runs-on: ubuntu-latest
    steps:
      - name: Read CRAN check results
        env:
          PKG: ${{ inputs.package }}
        run: |
          url="https://cran.r-project.org/web/checks/check_results_${PKG}.html"
          code=$(curl -s -o page.html -w '%{http_code}' "$url")
          if [ "$code" = "404" ]; then
            echo "$PKG is not on CRAN yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "CRAN did not answer ($code); trying again next week." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=$(grep -oE '>(ERROR|WARN|FAIL)<' page.html | sort | uniq -c || true)
          if [ -n "$bad" ]; then
            {
              echo "CRAN reports problems for $PKG: $url"
              echo
              echo "$bad"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All CRAN checks OK or NOTE for $PKG: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Release the version CRAN published
        # When CRAN accepts a new version, tag it and publish a GitHub release
        # (Zenodo then mints its DOI), so GitHub and CRAN versions never diverge.
        env:
          PKG: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(curl -s "https://cran.r-project.org/web/packages/${PKG}/index.html" \
            | tr -d '\n' | grep -oE 'Version:</td>[[:space:]]*<td>[0-9.\-]+' | grep -oE '[0-9][0-9.\-]*$' || true)
          if [ -z "$version" ]; then
            echo "No CRAN version to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "v$version" --repo "$REPO" >/dev/null 2>&1; then
            echo "v$version is already released." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "v$version" --repo "$REPO" --target main --title "v$version" \
            --notes "Version $version, as published on CRAN: https://cran.r-project.org/package=${PKG}"
          echo "Released v$version to match CRAN." >> "$GITHUB_STEP_SUMMARY"
